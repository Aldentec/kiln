<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kiln — Accessible React Component Library</title>
    <meta name="description" content="Kiln is a lightweight, accessible React component library for indie developers. WCAG AA compliant, &lt; 25 KB gzipped, zero dependencies. Install and ship in under 2 minutes." />
    <meta name="keywords" content="React, component library, accessible, WCAG, ARIA, TypeScript, lightweight, zero dependency, UI components, indie developer, dark mode, mobile-first" />
    <meta name="author" content="Dorian Smith" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <link rel="canonical" href="https://kiln-ui.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kiln — Accessible React Component Library" />
    <meta property="og:description" content="Lightweight, WCAG AA compliant React components for indie developers. &lt; 25 KB gzipped, zero config, zero dependencies." />
    <meta property="og:url" content="https://kiln-ui.com/" />
    <meta property="og:site_name" content="Kiln" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://kiln-ui.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Kiln — Ship fast without compromise" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kiln — Accessible React Component Library" />
    <meta name="twitter:description" content="Lightweight, WCAG AA compliant React components for indie developers. &lt; 25 KB gzipped, zero config." />
    <meta name="twitter:image" content="https://kiln-ui.com/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="theme-color" content="#6366f1" />

    <!-- Preconnect + async font load (non-render-blocking) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet" /></noscript>

    <!-- JSON-LD: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Kiln",
      "alternateName": "@doriansmith/kiln",
      "description": "An accessible, performant React component library for indie developers and small teams. WCAG AA compliant, under 25 KB gzipped, zero dependencies.",
      "url": "https://kiln-ui.com",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "Web, Browser",
      "programmingLanguage": "JavaScript, TypeScript",
      "softwareVersion": "0.2.2",
      "license": "https://opensource.org/licenses/MIT",
      "author": {
        "@type": "Person",
        "name": "Dorian Smith",
        "url": "https://doriansmith.dev"
      },
      "codeRepository": "https://github.com/Aldentec/kiln",
      "downloadUrl": "https://www.npmjs.com/package/@doriansmith/kiln",
      "featureList": [
        "WCAG AA compliant components",
        "Keyboard navigation",
        "Focus management",
        "ARIA attributes",
        "Dark mode support",
        "TypeScript types",
        "Mobile-first responsive",
        "Zero layout shift",
        "GPU-accelerated animations"
      ],
      "screenshot": "https://kiln-ui.com/og-image.png",
      "softwareHelp": {
        "@type": "CreativeWork",
        "url": "https://kiln-ui.com/components"
      }
    }
    </script>

    <!-- JSON-LD: WebSite + SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Kiln",
      "url": "https://kiln-ui.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://kiln-ui.com/components?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding:2rem;text-align:center;font-family:system-ui,sans-serif;max-width:700px;margin:0 auto;color:#1a1a2e;">
        <h1 style="font-size:2rem;margin-bottom:0.5rem;">Kiln — Accessible React Component Library</h1>
        <p style="font-size:1.1rem;color:#555;">An accessible, performant React component library for indie developers and small teams. WCAG AA compliant, under 25 KB gzipped, zero dependencies.</p>
        <p><a href="https://www.npmjs.com/package/@doriansmith/kiln" style="color:#6366f1;">Install on npm</a> &middot; <a href="https://github.com/Aldentec/kiln" style="color:#6366f1;">View on GitHub</a></p>
        <h2 style="margin-top:2rem;">Features</h2>
        <ul style="text-align:left;display:inline-block;">
          <li>20+ accessible React components — Button, Input, Modal, Tabs, Card, Badge, Chip, and more</li>
          <li>WCAG AA compliance with keyboard navigation, focus management, and ARIA</li>
          <li>Under 25 KB gzipped with zero dependencies</li>
          <li>TypeScript fully typed with complete type inference</li>
          <li>Dark mode via data-theme attribute</li>
          <li>Mobile-first responsive design with 44x44px touch targets</li>
        </ul>
        <h2 style="margin-top:2rem;">Quick Start</h2>
        <pre style="background:#f4f4f8;padding:1rem;border-radius:8px;text-align:left;"><code>npm install @doriansmith/kiln</code></pre>
        <pre style="background:#f4f4f8;padding:1rem;border-radius:8px;text-align:left;"><code>import '@doriansmith/kiln/kiln.css';
import { Button, Input, Card } from '@doriansmith/kiln';</code></pre>
      </div>
    </noscript>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
