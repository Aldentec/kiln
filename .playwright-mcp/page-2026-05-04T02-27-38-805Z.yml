            - heading "Performance-first" [level=3] [ref=e69]
            - paragraph [ref=e70]: "Kiln components don't tank your Lighthouse score. Zero layout shift on every interaction. All animations use transform and opacity: GPU-accelerated, no layout thrashing. Bundle size is measured and budgeted."
