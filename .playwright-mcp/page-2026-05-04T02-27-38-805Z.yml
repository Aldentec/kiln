            - heading "Genuinely mobile-ready" [level=3] [ref=e77]
            - paragraph [ref=e78]: Every component works on real devices at 375px. All interactive elements meet the 44x44px touch target requirement. No text below 14px on small screens. Positioned overlays are viewport-constrained. Mobile is not optional.
